name: Config Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 6'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python3
      uses: actions/setup-python@v2
      with:
        python-version: 3.x
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml
        wget https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64.tar.gz -O - | tar xz && sudo mv yq_linux_amd64 /usr/bin/yq
    - name: create cla_ruleset.yaml
      run: |
        curl -O https://gist.githubusercontent.com/KerryJi/${{ secrets.GIST_ID }}/raw/cla_providers.yaml
        yq eval-all '. as $item ireduce ({}; . * $item)' base/cla_base_ruleset.yaml base/user.yaml cla_providers.yaml > cla_ruleset.yaml
        yq eval-all '. as $item ireduce ({}; . * $item)' cla_ruleset.yaml base/cla_proxy_rule_all.yaml > cla_ruleset_all.yaml
        yq eval-all '. as $item ireduce ({}; . * $item)' base/cla_base_ruleset.yaml base/user_redirhost.yaml cla_providers.yaml > cla_ruleset_redirhost.yaml
        yq eval-all '. as $item ireduce ({}; . * $item)' cla_ruleset_redirhost.yaml base/cla_proxy_rule_all.yaml > cla_ruleset_all_redirhost.yaml
        yq eval-all '. as $item ireduce ({}; . * $item)' base/cla_base_ruleset.yaml base/user_router.yaml cla_providers.yaml > cla_ruleset_router.yaml
        yq eval-all '. as $item ireduce ({}; . * $item)' cla_ruleset_router.yaml base/cla_proxy_rule_all.yaml > cla_ruleset_all_router.yaml
    - name: Push to gist
      uses: exuanbo/actions-deploy-gist@v1
      with:
        token: ${{ secrets.GIST_TOKEN }}
        gist_id:  ${{ secrets.GIST_ID }}
        file_path: cla_ruleset.yaml
        file_type: text
    - name: Push to gist
      uses: exuanbo/actions-deploy-gist@v1
      with:
        token: ${{ secrets.GIST_TOKEN }}
        gist_id:  ${{ secrets.GIST_ID }}
        file_path: cla_ruleset_all.yaml
        file_type: text
    - name: Push to gist
      uses: exuanbo/actions-deploy-gist@v1
      with:
        token: ${{ secrets.GIST_TOKEN }}
        gist_id:  ${{ secrets.GIST_ID }}
        file_path: cla_ruleset_redirhost.yaml
        file_type: text
    - name: Push to gist
      uses: exuanbo/actions-deploy-gist@v1
      with:
        token: ${{ secrets.GIST_TOKEN }}
        gist_id:  ${{ secrets.GIST_ID }}
        file_path: cla_ruleset_all_redirhost.yaml
        file_type: text
    - name: Push to gist
      uses: exuanbo/actions-deploy-gist@v1
      with:
        token: ${{ secrets.GIST_TOKEN }}
        gist_id:  ${{ secrets.GIST_ID }}
        file_path: cla_ruleset_router.yaml
        file_type: text
    - name: Push to gist
      uses: exuanbo/actions-deploy-gist@v1
      with:
        token: ${{ secrets.GIST_TOKEN }}
        gist_id:  ${{ secrets.GIST_ID }}
        file_path: cla_ruleset_all_router.yaml
        file_type: text
